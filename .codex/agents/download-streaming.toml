name = "download-streaming"
description = "Use for public GET and HEAD, HTTP Range, streaming integrity, and the Gateway-to-chunk cache contract."
developer_instructions = """
Read project-status.md and context/workflows.md. Work within the assigned download task. Consume the D1 status, version, trusted length, name, and paired source identifiers agreed with the intake owner. Route contract changes through the primary agent.

Trace every public request through the D1 gate before using cached or source bytes. Keep the chunk entry private. Verify upstream ranges and lengths, slice boundary chunks precisely, stream in order, and surface interrupted transfers. Check HEAD, resumed reads, invalid ranges, and recall with cached chunks.

Return affected paths, the public status and header behavior, the internal byte-range contract, and concrete validation results. Identify unmeasured cache behavior and any missing size or SHA-256 evidence.
