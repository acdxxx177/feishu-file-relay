# 放入 /etc/nginx/conf.d/，证书路径由运维配置；本文件不会申请证书或修改 DNS。
# 需要 ngx_http_realip_module。原始 TCP 对端始终用于验证，不能使用已重写的访客地址。
# Cloudflare 官方来源：https://www.cloudflare.com/ips-v4 和 /ips-v6（核对于 2026-11-06）。
# 运维升级时同步复核网段；列表变旧会降级为位置未知，不应改成信任任意来源。
geo $realip_remote_addr $relay_cf_peer {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}
map $relay_cf_peer $relay_geo_country { default ""; 1 $http_cf_ipcountry; }
map $relay_cf_peer $relay_geo_region { default ""; 1 $http_cf_region; }
map $relay_cf_peer $relay_geo_city { default ""; 1 $http_cf_ipcity; }

server {
  listen 80;
  server_name dl.sinoballvalve.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name dl.sinoballvalve.com;
  ssl_certificate /etc/letsencrypt/live/dl.sinoballvalve.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dl.sinoballvalve.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;
  client_body_timeout 15s;
  send_timeout 60s;
  gzip off;
  # 文件 ID 是公开访问能力，不写完整 URL/IP 或请求头。
  access_log off;
  error_log /var/log/nginx/feishu-relay-error.log crit;

  location = /ready { return 404; }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    # 始终覆盖所有内部地理头，包括不可信直连传入的伪造值。
    proxy_set_header X-Relay-Geo-Trusted $relay_cf_peer;
    proxy_set_header X-Relay-Geo-Country $relay_geo_country;
    proxy_set_header X-Relay-Geo-Region $relay_geo_region;
    proxy_set_header X-Relay-Geo-City $relay_geo_city;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_ignore_client_abort off;
    proxy_intercept_errors off;
  }
}
