# 放入 /etc/nginx/conf.d/，证书路径由运维配置；本文件不会申请证书或修改 DNS。
server {
  listen 80;
  server_name dl.sinoballvalve.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name dl.sinoballvalve.com;
  ssl_certificate /etc/letsencrypt/live/dl.sinoballvalve.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dl.sinoballvalve.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;
  client_body_timeout 15s;
  send_timeout 60s;
  gzip off;
  # 文件 ID 是公开访问能力，不写完整 URL/IP 或请求头。
  access_log off;
  error_log /var/log/nginx/feishu-relay-error.log crit;

  location = /ready { return 404; }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_ignore_client_abort off;
    proxy_intercept_errors off;
  }
}
